name: Release

on:
  push:
    tags: ['v*']

jobs:
  # Publish to npm via a Trusted Publisher (OIDC) -- no NPM_TOKEN secret.
  # npmjs.com must have this repo + workflow registered as a trusted publisher
  # for the `business-central-mcp` package (see README/release runbook).
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # setup-node bundles npm 10 with Node 22; OIDC trusted publishing needs
      # npm >= 11.5.1. Upgrade before publishing.
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Guard - tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }

      - name: Unit + protocol tests
        run: npm run test

      # No NODE_AUTH_TOKEN: the trusted publisher exchanges the OIDC token for
      # short-lived npm credentials automatically, and attaches provenance.
      # `prepublishOnly` (typecheck + clean + build) runs as part of publish.
      - name: Publish to npm
        run: npm publish

  build-dxt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build .dxt artifact
        run: npm run build:dxt

      - name: Verify .dxt artifact exists
        run: test -f dist-dxt/business-central-mcp.dxt

      - name: Attach .dxt to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-dxt/business-central-mcp.dxt
          generate_release_notes: true
          fail_on_unmatched_files: true
